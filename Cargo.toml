[package]
name = "pitype"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "A dead-simple typing practice app built with GPUI Kit"
repository = "https://github.com/raythurman2386/pitype"
readme = "README.md"
keywords = ["typing", "wpm", "trainer", "gpui"]
categories = ["gui", "education"]

[lib]
name = "pitype"
path = "src/lib.rs"

[[bin]]
name = "pitype"
path = "src/main.rs"

[dependencies]
anyhow = "1"
directories = "6"
gpui-kit = "0.6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust-embed = "8"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2