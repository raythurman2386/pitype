<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Rounded-square app tile -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#222822"/>
  <!-- Keyboard body -->
  <rect x="16" y="34" width="96" height="60" rx="10" fill="#2d3830" stroke="#4ade80" stroke-width="4"/>
  <!-- Key rows -->
  <g fill="#e8d5b7">
    <rect x="26" y="46" width="10" height="10" rx="2"/>
    <rect x="42" y="46" width="10" height="10" rx="2"/>
    <rect x="58" y="46" width="10" height="10" rx="2"/>
    <rect x="74" y="46" width="10" height="10" rx="2"/>
    <rect x="90" y="46" width="10" height="10" rx="2"/>
    <rect x="26" y="62" width="10" height="10" rx="2"/>
    <rect x="42" y="62" width="10" height="10" rx="2"/>
    <rect x="58" y="62" width="10" height="10" rx="2"/>
    <rect x="74" y="62" width="10" height="10" rx="2"/>
    <rect x="90" y="62" width="10" height="10" rx="2"/>
    <!-- Spacebar -->
    <rect x="34" y="78" width="58" height="8" rx="3" fill="#4ade80"/>
  </g>
  <!-- Speed caret -->
  <rect x="98" y="78" width="10" height="8" rx="3" fill="#4ade80"/>
</svg>